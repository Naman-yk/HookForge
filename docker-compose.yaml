services:
  postgres:
    image: postgres:17
    container_name: hookforge-postgres
    environment:
      POSTGRES_USER: hookforge
      POSTGRES_PASSWORD: hookforge_dev
      POSTGRES_DB: hookforge
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hookforge -d hookforge" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
